[package]
name = "mascord"
version = "0.1.0"
edition = "2021"

[dependencies]
# Discord
poise = "0.6.1"
serenity = { version = "0.12.5", features = ["voice", "gateway", "client", "model", "cache"] }
# crates.io 0.5 lacks DAVE/E2EE; track `next` until a release includes davey (see songbird#293).
songbird = { git = "https://github.com/serenity-rs/songbird.git", branch = "next", features = ["builtin-queue", "serenity"] }
# Songbird depends on symphonia with `default-features = false`, which disables all container
# demuxers. yt-dlp's default YouTube audio is WebM/Opus; Symphonia needs `mkv` (Matroska/WebM) to
# probe/decode. Cargo merges these features onto the unified symphonia package.
symphonia = { version = "0.5", default-features = false, features = ["mkv", "ogg", "aac", "isomp4", "mp3", "pcm"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
lru = "0.12"
async-trait = "0.1"

# HTTP & LLM
reqwest = { version = "0.12", features = ["json"] }
async-openai = "0.29"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
scraper = "0.26"
dom_smoothie = "0.17"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
humantime = "2"
anyhow = "1"
pulldown-cmark = "0.10"
rand = "0.8"
futures = "0.3"
# Vendored from crates.io 0.15.0 + Songbird `next` ConnectionInfo fix (see vendor/lavalink-rs/src/model/player.rs).
lavalink-rs = { path = "vendor/lavalink-rs", default-features = false, features = [
    "serenity",
    "songbird",
    "tungstenite-rustls-native-roots",
] }

# Lavalink uses the same Songbird revision as mascord (lavalink-rs depends on songbird 0.5 from crates.io).
[patch.crates-io]
songbird = { git = "https://github.com/serenity-rs/songbird.git", branch = "next" }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
